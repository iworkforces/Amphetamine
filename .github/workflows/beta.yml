name: Beta

# Package beta-suffixed macOS DMG/ZIP on every push to develop (including PR merges),
# then publish them as a GitHub *prerelease* (not a production release).
#
# NOTE: Do NOT use workflow_run here. GitHub only schedules workflow_run listeners
# from workflow files that exist on the repository default branch (main).
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Prefer completing the latest develop push; cancel only older beta runs for the same ref
# when a newer push supersedes them (intentional for prerelease packaging).
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Guard against OCWorkforces string (org does not exist; security risk)
        run: |
          if grep -rn "OCWorkforces" src/; then
            echo "ERROR: 'OCWorkforces' string found in src/ (org does not exist on GitHub)"
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run typecheck:sticky
      - run: bun run typecheck:layers
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run test

  # Resolve package version + next per-version beta index once; packaging jobs and
  # the release job all use the same N so filenames match the prerelease tag.
  # Tag: v1.9.7-beta.1  ·  files: Amphetamine-1.9.7-arm64-beta-1.dmg
  prepare:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      beta_n: ${{ steps.version.outputs.beta_n }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Resolve package version and beta sequence
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          # Per-version beta sequence: v1.9.7-beta.1, v1.9.7-beta.2, ...
          # Do NOT use github.run_number — it is global and does not reset on version bumps.
          PREFIX="v${VERSION}-beta."
          LAST=$(
            git tag -l "${PREFIX}*" \
              | sed -n "s/^${PREFIX}\\([0-9][0-9]*\\)$/\\1/p" \
              | sort -n \
              | tail -n 1 || true
          )
          if [ -n "${LAST}" ]; then
            BETA_N=$((LAST + 1))
          else
            BETA_N=1
          fi
          TAG="${PREFIX}${BETA_N}"
          while git rev-parse "${TAG}" >/dev/null 2>&1; do
            BETA_N=$((BETA_N + 1))
            TAG="${PREFIX}${BETA_N}"
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "beta_n=${BETA_N}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Using beta tag: ${TAG} (files will use -beta-${BETA_N})"

  package:
    needs: [lint, test, prepare]
    strategy:
      matrix:
        include:
          - runs-on: macos-latest
            arch: arm64
          - runs-on: macos-15-intel
            arch: x64
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/electron
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-

      - run: bun install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - run: bun run build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - name: Verify build artifacts
        run: |
          test -f lib/main/index.cjs || { echo 'ERROR: lib/main/index.cjs missing'; exit 1; }
          test -f lib/preload/index.cjs || { echo 'ERROR: lib/preload/index.cjs missing'; exit 1; }

      - name: Package macOS ${{ matrix.arch }}
        run: bunx electron-builder --mac dmg zip --${{ matrix.arch }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append -beta-N suffix to DMG and ZIP filenames
        env:
          BETA_N: ${{ needs.prepare.outputs.beta_n }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          renamed=0
          SUFFIX="beta-${BETA_N}"
          for f in dist/*.dmg dist/*.zip; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            ext="${base##*.}"
            name="${base%.*}"
            if [[ "$name" == *"-${SUFFIX}" ]]; then
              echo "Already beta-suffixed: $f"
              continue
            fi
            # Amphetamine-1.9.7-arm64.dmg → Amphetamine-1.9.7-arm64-beta-1.dmg
            dest="${dir}/${name}-${SUFFIX}.${ext}"
            echo "Renaming $f -> $dest"
            mv "$f" "$dest"
            renamed=$((renamed + 1))
          done
          if [ "$renamed" -eq 0 ]; then
            beta_count=$(find dist -maxdepth 1 \( -name "*-${SUFFIX}.dmg" -o -name "*-${SUFFIX}.zip" \) | wc -l | tr -d ' ')
            if [ "$beta_count" -eq 0 ]; then
              echo "ERROR: No DMG/ZIP found to rename with -${SUFFIX} suffix"
              ls -la dist/ || true
              exit 1
            fi
          fi
          echo "Beta artifacts:"
          find dist -maxdepth 1 \( -name "*-${SUFFIX}.dmg" -o -name "*-${SUFFIX}.zip" \) | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-mac-beta-${{ matrix.arch }}
          path: |
            dist/*-beta-${{ needs.prepare.outputs.beta_n }}.dmg
            dist/*-beta-${{ needs.prepare.outputs.beta_n }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package-windows:
    needs: [lint, test, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            arch: x64
          - runs-on: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.cache/electron
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-
            ${{ runner.os }}-electron-

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-beta-
            ${{ runner.os }}-${{ matrix.arch }}-electron-builder-
            ${{ runner.os }}-electron-builder-

      - run: bun install --frozen-lockfile
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - run: bun run build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron

      - name: Verify build artifacts
        shell: bash
        run: |
          test -f lib/main/index.cjs || { echo 'ERROR: lib/main/index.cjs missing'; exit 1; }
          test -f lib/preload/index.cjs || { echo 'ERROR: lib/preload/index.cjs missing'; exit 1; }

      - name: Package Windows ${{ matrix.arch }}
        run: bunx electron-builder --win nsis portable --${{ matrix.arch }}
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append -beta-N suffix to Windows EXE filenames
        shell: bash
        env:
          BETA_N: ${{ needs.prepare.outputs.beta_n }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          renamed=0
          SUFFIX="beta-${BETA_N}"
          for f in dist/*.exe; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            name="${base%.*}"
            if [[ "$name" == *"-${SUFFIX}" ]]; then
              echo "Already beta-suffixed: $f"
              continue
            fi
            # Amphetamine-1.9.7-arm64.exe → Amphetamine-1.9.7-arm64-beta-1.exe
            dest="${dir}/${name}-${SUFFIX}.exe"
            echo "Renaming $f -> $dest"
            mv "$f" "$dest"
            renamed=$((renamed + 1))
          done
          if [ "$renamed" -eq 0 ]; then
            beta_count=$(find dist -maxdepth 1 -name "*-${SUFFIX}.exe" | wc -l | tr -d ' ')
            if [ "$beta_count" -eq 0 ]; then
              echo "ERROR: No EXE found to rename with -${SUFFIX} suffix"
              ls -la dist/ || true
              exit 1
            fi
          fi
          echo "Beta Windows artifacts:"
          find dist -maxdepth 1 -name "*-${SUFFIX}.exe" | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-win-beta-${{ matrix.arch }}
          path: |
            dist/*-beta-${{ needs.prepare.outputs.beta_n }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Publish packaged beta builds to the GitHub Releases page as a prerelease.
  # Production CD still owns non-prerelease tags vX.Y.Z from main.
  release:
    needs: [prepare, package, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Fetch tags
        run: git fetch --tags --force origin

      - name: Resolve previous beta tag
        id: prev
        run: |
          set -euo pipefail
          CURRENT="${{ needs.prepare.outputs.tag }}"
          # Prefer previous beta prerelease tag for develop changelog range
          PREV=$(git tag -l 'v*-beta.*' --sort=-v:refname             | grep -vxF "$CURRENT"             | head -n 1 || true)
          if [ -z "${PREV}" ]; then
            # Fall back to latest production tag if no prior beta exists
            PREV=$(git tag -l 'v*' --sort=-v:refname               | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'               | head -n 1 || true)
          fi
          if [ -n "${PREV}" ]; then
            echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
            echo "previous tag for notes: ${PREV}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "no previous tag for notes range"
          fi

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          PREV="${{ steps.prev.outputs.tag }}"
          TARGET="${GITHUB_SHA}"
          VERSION="${{ needs.prepare.outputs.version }}"
          BETA_N="${{ needs.prepare.outputs.beta_n }}"
          SHORT_SHA="${{ needs.prepare.outputs.short_sha }}"

          ARGS=(repos/${{ github.repository }}/releases/generate-notes -f "tag_name=${TAG}" -f "target_commitish=${TARGET}")
          if [ -n "${PREV}" ]; then
            ARGS+=(-f "previous_tag_name=${PREV}")
          fi

          RESPONSE=$(gh api "${ARGS[@]}")
          BODY=$(echo "$RESPONSE" | jq -r '.body // empty')
          NAME=$(echo "$RESPONSE" | jq -r --arg n "Amphetamine ${VERSION} beta.${BETA_N} (${SHORT_SHA})" '.name // $n')

          {
            echo "name<<EOF"
            echo "${NAME}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "## Amphetamine ${VERSION} beta.${BETA_N}"
            echo ""
            echo "Pre-release build from \`develop\` (commit \`${GITHUB_SHA}\`)."
            echo ""
            echo "- **Not** a production release — production tags remain \`vX.Y.Z\` from \`main\` / CD"
            echo "- Tag: \`${TAG}\`"
            echo "- Artifacts are filename-suffixed with \`-beta-${BETA_N}\` (e.g. \`Amphetamine-${VERSION}-arm64-beta-${BETA_N}.dmg\`)"
            echo "- Install may require removing quarantine if unsigned / ad-hoc signed"
            echo ""
            if [ -n "${PREV}" ]; then
              echo "Changes since **${PREV}**."
            else
              echo "No previous tag found; notes cover available history."
            fi
            echo ""
            echo "---"
            echo ""
            if [ -n "${BODY}" ]; then
              echo "${BODY}"
            else
              echo "_No auto-generated commit range available._"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download arm64 beta artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-mac-beta-arm64
          path: artifacts/arm64

      - name: Download x64 beta artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-mac-beta-x64
          path: artifacts/x64

      - name: Download Windows x64 beta artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-win-beta-x64
          path: artifacts/win-x64

      - name: Download Windows arm64 beta artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-win-beta-arm64
          path: artifacts/win-arm64

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BETA_N: ${{ needs.prepare.outputs.beta_n }}
        run: bun run scripts/verify-beta-release-matrix.ts "$VERSION" "$BETA_N"

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          make_latest: false
          # Body already includes API-generated notes
          generate_release_notes: false
          files: |
            artifacts/**/*-beta-${{ needs.prepare.outputs.beta_n }}.dmg
            artifacts/**/*-beta-${{ needs.prepare.outputs.beta_n }}.zip
            artifacts/**/*-beta-${{ needs.prepare.outputs.beta_n }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
